name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-quality:
    # Ubuntu 22.04 permits the unprivileged user/network namespaces exercised by
    # the fail-closed sandbox and offline installer acceptance tests.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux isolation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap util-linux
          bwrap --version
          unshare --user --map-root-user --net true
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt
          python -m pip install --no-deps --editable .
      - name: Offline quality gate
        env:
          PROMPTPERP_ALLOW_EXTERNAL_EFFECTS: "0"
        run: ./scripts/quality.sh
