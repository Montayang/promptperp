[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptperp"
version = "0.1.0"
description = "AI-native, safety-gated runtime for Binance USD-M futures strategies"
authors = [{name = "Montayang"}]
keywords = ["ai", "binance", "futures", "risk", "trading"]

readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

dependencies = [
    "requests",
    "binance-sdk-derivatives-trading-usds-futures",
    "python-dotenv",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
quality = ["build==1.3.0", "mypy==1.17.1", "ruff==0.12.12"]

[project.urls]
Documentation = "https://github.com/Montayang/promptperp#readme"
Issues = "https://github.com/Montayang/promptperp/issues"
Repository = "https://github.com/Montayang/promptperp"

[project.scripts]
promptperp-deploy = "promptperp.operations.deployment_service:main"
promptperp-platform = "promptperp.operations.platform_service:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["promptperp*"]
namespaces = true

[tool.setuptools.package-data]
promptperp = ["py.typed", "storage/migrations/*.sql"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
